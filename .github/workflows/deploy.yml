name: Test → Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  # ─── Tier 1: Core feature pages — fast-fail gate ─────────────────────────
  playwright-tier1:
    name: Playwright E2E — Tier 1 (Core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Playwright E2E — Tier 1
        run: npx playwright test agent-factory-create agent-factory-byo manage-agent-dashboard trade-history --reporter=list
        env:
          NEXT_PUBLIC_API_URL: https://quantik-backend-production.up.railway.app

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-tier1-results
          path: test-results/
          retention-days: 7

  # ─── Tier 2: Rich UI — Architecture, Agent World, Dashboard ──────────────
  playwright-tier2:
    name: Playwright E2E — Tier 2 (Rich UI)
    runs-on: ubuntu-latest
    needs: playwright-tier1
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Playwright E2E — Tier 2
        run: npx playwright test manage-agent-architecture manage-agent-world dashboard relay-chat --reporter=list
        env:
          NEXT_PUBLIC_API_URL: https://quantik-backend-production.up.railway.app

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-tier2-results
          path: test-results/
          retention-days: 7

  # ─── Deploy: only after both test tiers pass ─────────────────────────────
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [playwright-tier1, playwright-tier2]
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel (Production)
        run: vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_K3CspWQSJ6oFNZ18u1HDvxq0
          VERCEL_PROJECT_ID: prj_ScfCgUeTONsD6CnHZyv4e96N5n8R
