name: Test → Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  # ─── Tier 1: Fully mocked, no SSE, fast-fail gate ──────────────────────────
  cypress-tier1:
    name: Cypress E2E — Tier 1 (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Cypress E2E — Tier 1
        uses: cypress-io/github-action@v6
        with:
          start: npm run dev
          wait-on: "http://localhost:3000"
          wait-on-timeout: 90
          spec: "cypress/e2e/autopilot.cy.ts,cypress/e2e/market-chart.cy.ts,cypress/e2e/market-scanner.cy.ts,cypress/e2e/mobile.cy.ts,cypress/e2e/orchestrator.cy.ts,cypress/e2e/settings.cy.ts,cypress/e2e/execute-trade.cy.ts,cypress/e2e/infinite-scroll.cy.ts"
        env:
          NEXT_PUBLIC_API_URL: https://quantik-backend-production.up.railway.app

  # ─── Tier 2: SSE-stubbed via fetch intercept ───────────────────────────────
  cypress-tier2:
    name: Cypress E2E — Tier 2 (SSE mocked)
    runs-on: ubuntu-latest
    needs: cypress-tier1
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cypress E2E — Tier 2
        uses: cypress-io/github-action@v6
        with:
          start: npm run dev
          wait-on: "http://localhost:3000"
          wait-on-timeout: 90
          spec: "cypress/e2e/market-pipeline.cy.ts,cypress/e2e/pipeline-flow.cy.ts,cypress/e2e/pipeline-log.cy.ts,cypress/e2e/trading.cy.ts,cypress/e2e/signal-validator.cy.ts,cypress/e2e/market-page-layout.cy.ts"
        env:
          NEXT_PUBLIC_API_URL: https://quantik-backend-production.up.railway.app

  # ─── Deploy: only after both test tiers pass ───────────────────────────────
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [cypress-tier1, cypress-tier2]
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel (Production)
        run: vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_K3CspWQSJ6oFNZ18u1HDvxq0
          VERCEL_PROJECT_ID: prj_ScfCgUeTONsD6CnHZyv4e96N5n8R
