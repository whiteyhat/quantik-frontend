name: Test → Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  test:
    name: TypeScript + Cypress E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Cypress E2E — full suite
        uses: cypress-io/github-action@v6
        with:
          start: npm run dev
          wait-on: "http://localhost:3000"
          wait-on-timeout: 90
          spec: |
            cypress/e2e/agent-field-contracts.cy.ts
            cypress/e2e/navigation.cy.ts
            cypress/e2e/dashboard.cy.ts
            cypress/e2e/relay-chat.cy.ts
        env:
          NEXT_PUBLIC_API_URL: https://quantik-backend-production.up.railway.app
          CYPRESS_API_URL: https://quantik-backend-production.up.railway.app
          CYPRESS_allowCypressEnv: "false"

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel (Production)
        run: vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_K3CspWQSJ6oFNZ18u1HDvxq0
          VERCEL_PROJECT_ID: prj_ScfCgUeTONsD6CnHZyv4e96N5n8R
